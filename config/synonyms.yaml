    - "persoana de contact in caz de urgenta"
    - "nume persoana de contact"
    - "emergency contact name"
    - "emergency contact person"
    - "emergency contact person full name"
    - "emergency contact"
    - "emergency kin"
    - "next of kin"
    - "next of kin name"
    - "full name of emergency contact"
    - "контактное лицо"
    - "контактное лицо на случай чс"
    - "фио контактного лица"
    - "экстренный контакт"
    - "имя родственника для связи"
  patterns:
    - 'persoan[aă]\s*(de\s*)?contact.*urgen[tț]'

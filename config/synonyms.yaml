emergency_phone:
  keywords:
    - "telefon persoana de contact"
    - "telefon de urgenta"
    - "emergency phone"
    - "emergency contact phone"
    - "emergency contact phone number"
    - "next of kin phone"
    - "emergency mobile"
    - "телефон контактного лица"

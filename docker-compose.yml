services:
  sws-auto-bot:
    build: .
    container_name: sws-auto-bot
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./config:/app/config
      - ./screenshots:/app/screenshots
    ipc: host
    ulimits:
      core:
        soft: 0
        hard: 0
    environment:
      - HEADLESS=true
    command: ["--bot"]
